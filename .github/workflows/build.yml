name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q GlassLauncher.zip
      - run: printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > TvLauncher/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - shell: bash
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log
        working-directory: TvLauncher
      - if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |error:|What went wrong|Execution failed" -A3 build.log | head -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: TvLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: TvLauncher/app/build/outputs/apk/debug/*.apk
